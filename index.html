function ruletaTira(s){

  const R=RULETAS[n];s.querySelectorAll(".rslot").forEach((b,i)=>{b.querySelector("small").textContent=R.c[i][0];b.dataset.v="";b.setAttribute("aria-pressed","false");b.querySelector(".lk").textContent="🔓"});
  const ir=s.querySelector(".ir");if(ir){ir.hidden=false;ir.href="#/unidad/"+n;ir.textContent="Ir a la unidad "+n+": "+UNIDADES[n-1].t}}
 const R=RULETAS[n],sl=[...s.querySelectorAll(".rslot")],fr=s.querySelector(".rfr");

 const fin=()=>{const v=sl.map(b=>b.dataset.v);fr.innerHTML=(s.classList.contains("home")?`<i>Reto de la unidad ${n}.</i> `:"")+R.f.replace(/\{(\d)\}/g,(m,i)=>v[+i]);fr.dataset.txt=fr.textContent;s.classList.remove("gira")};
 let pend=0;
 sl.forEach((b,i)=>{
  if(b.getAttribute("aria-pressed")==="true"&&b.dataset.v)return;
  const op=R.c[i][1];pend++;
  const fija=()=>{b.dataset.v=op[Math.floor(Math.random()*op.length)];b.querySelector(".rv").textContent=b.dataset.v;b.classList.remove("spin")};
  if(red){fija();if(!--pend)fin();return}
  b.classList.add("spin");s.classList.add("gira");
  const iv=setInterval(()=>{b.querySelector(".rv").textContent=op[Math.floor(Math.random()*op.length)]},70);

 });
 if(!pend)fin();
}

const ENC_KF=[[450,0],[250,140],[180,140],[130,135],[70,145],[45,150]];
function encRect(t){
 const h=450*Math.pow(0.1,t/100);let top=0;
 for(let i=0;i<ENC_KF.length-1;i++){const [h1,t1]=ENC_KF[i],[h2,t2]=ENC_KF[i+1];if(h<=h1&&h>=h2){top=t1+(t2-t1)*(h1-h)/(h1-h2);break}}
 const w=h*16/9;return [400-w/2,top,w,h];
}
function encName(t){const h=450*Math.pow(0.1,t/100);return h>=330?"Plano general":h>=235?"Plano entero":h>=165?"Plano americano":h>=105?"Plano medio":h>=60?"Primer plano":"Gran primer plano"}

 const sm=document.createElement("canvas");sm.width=w;sm.height=h;sm.getContext("2d").drawImage(o,0,0,w,h);

function updCol(f){
 const [r,g,b]=[...f.querySelectorAll("[data-col]")].map(x=>+x.value);
 f.querySelector(".cr").textContent=r;f.querySelector(".cg").textContent=g;f.querySelector(".cb").textContent=b;
 f.querySelector(".col-sw").style.background=`rgb(${r},${g},${b})`;
 const mx=Math.max(r,g,b)/255,mn=Math.min(r,g,b)/255,d=mx-mn;let h=0;
 if(d){const R=r/255,G=g/255,B=b/255;h=mx===R?((G-B)/d)%6:mx===G?(B-R)/d+2:(R-G)/d+4;h=Math.round((h*60+360)%360)}
 const l=(mx+mn)/2,sat=d?d/(1-Math.abs(2*l-1)):0,hex="#"+[r,g,b].map(x=>x.toString(16).padStart(2,"0")).join("").toUpperCase();
 f.querySelector(".desc").innerHTML=`<b>${hex}</b> · RGB(${r}, ${g}, ${b}) · Tono ${h}° · Saturación ${Math.round(sat*100)} % · Luminosidad ${Math.round(l*100)} %.<br>En la <b>síntesis aditiva</b> (pantallas) el rojo, el verde y el azul se suman: los tres al máximo dan blanco y los tres a cero, negro.`;
}

function simAng(f){
 const v=+f.querySelector("[data-sl=v]").value,g=+f.querySelector("[data-sl=h]").value,r=v*Math.PI/180,q=g*Math.PI/180;
 f.querySelector("#cv").setAttribute("transform",`translate(${100-70*Math.cos(r)} ${110-70*Math.sin(r)})`);
 f.querySelector("#ch").setAttribute("transform",`translate(${300+70*Math.sin(q)} ${110+70*Math.cos(q)})`);
 const cx=100-70*Math.cos(r),cy=110-70*Math.sin(r),ux=(100-cx)/70,uy=(110-cy)/70;
 f.querySelector("#cono").setAttribute("points",`${cx},${cy} ${100-uy*45},${110+ux*45} ${100+uy*45},${110-ux*45}`);
 const av=Math.abs(v),vn=av<=10?"normal":av>=80?(v>0?"cenital":"nadir"):(v>0?"picado":"contrapicado");
 const hh=g>180?360-g:g,hn=hh<=20?"frontal":hh<=70?"frontal a 45°":hh<=110?"lateral a 90°":hh<=160?"lateral trasero a 45°":"trasero a 180°";
 const E={normal:"cámara a la altura de los ojos; es neutra.",picado:"el sujeto parece pequeño o vulnerable.",contrapicado:"el sujeto parece grande o poderoso.",cenital:"vista en vertical desde arriba.",nadir:"vista en vertical desde abajo."};
 f.querySelector(".desc").innerHTML=`<strong>Angulación vertical: ${vn}</strong> (${v}°): ${E[vn]}<br><strong>Angulación horizontal: ${hn}</strong> (${g}°).`;
}

function ytApi(){
 if(YTP)return YTP;
 YTP=new Promise((ok,ko)=>{
  if(window.YT&&YT.Player)return ok();
  const s=document.createElement("script");s.src="https://www.youtube.com/iframe_api";s.onerror=()=>{YTP=null;ko()};
  const prev=window.onYouTubeIframeAPIReady;window.onYouTubeIframeAPIReady=()=>{prev&&prev();ok()};
  document.head.appendChild(s);setTimeout(()=>{if(!(window.YT&&YT.Player)){YTP=null;ko()}},10000);

async function durMide(g){
 durPaint(g);
 if(!navigator.onLine)return;
 const ids=[...g.querySelectorAll(".dur")].map(e=>e.dataset.dur).filter(i=>!durGet(i));
 if(!ids.length)return;
 try{await ytApi()}catch(e){return}
 const box=document.createElement("div");box.style.cssText="position:fixed;left:-9999px;top:0;width:200px;height:120px;overflow:hidden";document.body.appendChild(box);
 for(const id of ids){
  if(!document.body.contains(g))break;
  await new Promise(res=>{
   const d=document.createElement("div");box.appendChild(d);let pl,fin=false,n=0;
   const end=()=>{if(fin)return;fin=true;try{pl.destroy()}catch(e){}res()};
   try{pl=new YT.Player(d,{videoId:id,playerVars:{controls:0,rel:0},events:{onReady:()=>{const iv=setInterval(()=>{let s=0;try{s=pl.getDuration()}catch(e){}
    if(s>0){durSet(id,s);durPaint(g);clearInterval(iv);end()}else if(++n>16){clearInterval(iv);end()}},500)},onError:end}})}catch(e){end()}
   setTimeout(end,12000);
  });
 }
 box.remove();
}

function unidad(n){

 if(!u){location.hash="#/";return}
 const C=contenido(n);
 const nav=()=>{const a=n>1?UNIDADES[n-2]:null,z=UNIDADES[n]||null,nm=(u,i)=>u.f?"Situación de Aprendizaje final":"Unidad "+i;return `<nav class="unav" aria-label="Navegación entre unidades"><a class="back" href="#/"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round" aria-hidden="true"><path d="M3 11.5 12 4l9 7.5"/><path d="M5.5 10v10h13V10"/><path d="M10 20v-6h4v6"/></svg> Volver al inicio</a><span class="pn">${a?`<a href="#/unidad/${n-1}">← ${nm(a,n-1)}</a>`:""}${z?`<a href="#/unidad/${n+1}">${nm(z,n+1)} →</a>`:""}</span></nav>`};
 app.innerHTML=`<div class="ubar" id="ubar"><b>${u.f?"Situación de Aprendizaje":"Unidad "+n}</b><span class="ubt">${u.t}</span><span class="ubs" id="ubs"></span></div>${nav()}
 <div class="layout${C.toc?"":" sola"}">${C.toc?`<aside class="side">${C.toc}</aside>`:""}<div class="panel${u.f?" final":""}"><h2>${u.f?"Situación de Aprendizaje final: "+u.t:"Unidad "+n+". "+u.t}</h2>
 ${u.f?`<p class="mute">No es una unidad del currículo: es una Situación de Aprendizaje (SdA) en la que aplicas todo lo anterior para crear tu propia pieza.</p>`:""}
 ${C.html}${referencias(n)}</div></div><p><a class="back" href="#/interes">🌐 Páginas de interés: filmotecas, concursos y recursos</a></p>${nav()}`;
 document.title=`${u.t} · Imagen y Sonido`;
 spy.ult=null;
 scrollTo(0,0);
 setTimeout(spy,60);
}
// Resalta en el índice el apartado que se está leyendo y lo muestra en la barra superior
let _spy=0;
function spy(){
 _spy=0;const bar=document.getElementById("ubs");if(!bar)return;
 const bs=[...document.querySelectorAll(".side .toc [data-go]")];if(!bs.length)return;
 let act=null;
 for(const b of bs){const h=document.getElementById(b.dataset.go);if(h&&h.getBoundingClientRect().top<=90)act=b}
 bs.forEach(b=>b.classList.toggle("on",b===act));
 bar.textContent=act?act.textContent:"";
 if(act&&act!==spy.ult){spy.ult=act;const li=act.closest("li.g"),u=li&&li.querySelector(".subs");if(u&&u.hidden&&act.closest(".subs"))tocSet(li,true);
  const sd=act.closest(".side");if(sd&&sd.scrollHeight>sd.clientHeight){const r=act.getBoundingClientRect(),q=sd.getBoundingClientRect();if(r.top<q.top||r.bottom>q.bottom)sd.scrollTop+=r.top-q.top-q.height/3}}
}
addEventListener("scroll",()=>{if(!_spy)_spy=requestAnimationFrame(spy)},{passive:true});
function bloques(){
 app.innerHTML=`<a class="back" href="#/">Volver a las unidades</a><div class="panel"><h2>Bloques de saberes</h2>
 <ul class="enl">${BLOQUES.map((b,i)=>`<li><a href="#/bloque/${i+1}">${nb(i+1)}</a></li>`).join("")}</ul></div>`;
 document.title="Bloques de saberes · Imagen y Sonido";
 scrollTo(0,0);
}
function bloque(n){
 const b=BLOQUES[n-1];
 if(!b){location.hash="#/bloques";return}
 const us=UNIDADES.map((u,i)=>u.b.includes(n)?i+1:0).filter(Boolean);
 app.innerHTML=`<a class="back" href="#/bloques">Volver a los bloques</a>
 <div class="panel"><h2>${nb(n)}</h2>
 ${b.g.map(([h,l])=>(h?`<h3>${h}</h3>`:"")+`<ul>${l.map(x=>`<li>${x}</li>`).join("")}</ul>`).join("")}
 <h3>Unidades relacionadas</h3>
 <ul class="enl">${us.map(i=>`<li><a href="#/unidad/${i}">${UNIDADES[i-1].f?"Situación de Aprendizaje final":"Unidad "+i}. ${UNIDADES[i-1].t}</a></li>`).join("")}</ul></div>`;
 document.title=`${nb(n)} · Imagen y Sonido`;
 scrollTo(0,0);
}

function interes(){
 app.innerHTML=`<a class="back" href="#/">Volver a las unidades</a><div class="panel"><h2>Páginas de interés</h2>
 <p class="nota-i">Enlaces a las páginas principales de cada organización. Las webs cambian: si alguno no abre, búscalo por su nombre. Antes de participar en un concurso, lee siempre sus bases actualizadas.</p>
 ${INTERES.map(([t,l])=>`<h3>${t}</h3><ul class="enl">${l.map(([n,u,d])=>`<li><a href="${u}" target="_blank" rel="noopener">${n}</a><br><small>${d}</small></li>`).join("")}</ul>`).join("")}</div>`;

function ruta(){
 const h=location.hash;
 let m;
 if(m=h.match(/^#\/unidad\/(\d+)$/))unidad(+m[1]);
 else if(m=h.match(/^#\/bloque\/(\d+)$/))bloque(+m[1]);
 else if(h==="#/bloques")bloques();
 else if(h==="#/interes")interes();
 else inicio();
 if(!/#\/(unidad|bloque)\/\d+/.test(h)||true){scrollTo(0,0);requestAnimationFrame(()=>scrollTo(0,0));setTimeout(()=>scrollTo(0,0),80)}
}
try{history.scrollRestoration="manual"}catch(e){}
addEventListener("hashchange",()=>{if(AU){try{AU.o.stop();AU.c.close()}catch(e){}AU=null}ruta()});ruta();
const up=document.getElementById("arriba");
const casa=document.getElementById("casa");
function pintaBotones(){up.classList.toggle("ver",scrollY>400);const h=location.hash;casa.classList.toggle("ver",scrollY>400&&h!==""&&h!=="#/")}
addEventListener("scroll",pintaBotones,{passive:true});addEventListener("hashchange",pintaBotones);
casa.addEventListener("click",()=>{scrollTo(0,0);setTimeout(()=>scrollTo(0,0),80)});
up.addEventListener("click",()=>scrollTo({top:0,behavior:"smooth"}));
const est=document.getElementById("estado");
function pintaEstado(){est.textContent=navigator.onLine?"En línea":"Sin conexión"}
addEventListener("online",pintaEstado);addEventListener("offline",pintaEstado);pintaEstado();
if("serviceWorker" in navigator){
 navigator.serviceWorker.register("sw.js").then(()=>navigator.serviceWorker.ready).then(()=>{if(navigator.onLine)est.textContent="En línea · disponible sin conexión"}).catch(()=>{});
}
